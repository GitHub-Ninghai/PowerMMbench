<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerMMBench · 电力系统多模态推理基准</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<style>
  :root{
    --bg:#ffffff;
    --bg-2:#f8fafc;
    --ink:#0f172a;
    --ink-2:#334155;
    --ink-3:#64748b;
    --line:#e2e8f0;
    --accent:#ff8a5c;
    --accent-deep:#f97316;
    --glow:rgba(255,138,92,.38);
    --halo:rgba(255,162,122,.20);
    --blue:#2563eb;
    --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--font);
    background:
      radial-gradient(1100px 560px at 50% 32%, var(--halo), transparent 70%),
      linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
    -webkit-font-smoothing:antialiased;
  }
  /* 背景网格（径向遮罩，仅中心可见） */
  body::before{
    content:"";position:fixed;inset:0;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse 68% 58% at 50% 44%, #000 28%, transparent 76%);
            mask-image:radial-gradient(ellipse 68% 58% at 50% 44%, #000 28%, transparent 76%);
    opacity:.55;pointer-events:none;
    animation:fadeIn 1.2s ease both;
  }
  /* 浮动光晕 */
  .orb{position:fixed;border-radius:50%;filter:blur(46px);opacity:.55;pointer-events:none;animation:float 9s ease-in-out infinite}
  .orb.a{width:340px;height:340px;background:radial-gradient(circle,rgba(255,162,122,.40),transparent 70%);top:2%;left:6%}
  .orb.b{width:280px;height:280px;background:radial-gradient(circle,rgba(122,166,232,.30),transparent 70%);bottom:4%;right:8%;animation-delay:-3.5s}

  .wrap{position:relative;z-index:2;text-align:center;padding:0 24px;max-width:780px;width:100%}

  /* 闪电 logo */
  .logo{
    width:88px;height:88px;margin:0 auto 30px;
    display:flex;align-items:center;justify-content:center;
    border-radius:23px;
    background:linear-gradient(135deg,#2563eb,#0f172a);
    box-shadow:0 18px 50px -14px rgba(37,99,235,.50),0 0 0 1px rgba(255,255,255,.6) inset;
    animation:revealScale .9s .2s cubic-bezier(.2,.8,.2,1) both,glowPulse 4s 1.4s ease-in-out infinite;
  }
  .logo svg{width:48px;height:48px;display:block}

  .eyebrow{
    display:inline-flex;align-items:center;
    font-size:12.5px;letter-spacing:.20em;text-transform:uppercase;font-weight:700;
    color:var(--accent-deep);
    background:rgba(255,138,92,.10);
    border:1px solid rgba(255,138,92,.28);
    padding:7px 16px;border-radius:999px;
    margin-bottom:26px;
    animation:revealBlur .8s .4s ease both;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:9px;animation:shimmer 2s ease-in-out infinite}

  h1{
    font-size:clamp(46px,8.5vw,84px);
    font-weight:800;letter-spacing:-.035em;line-height:1.02;
    background:linear-gradient(120deg,#0f172a 0%,#1e3a8a 48%,#2563eb 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:cinematicEnter 1.1s .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .sub{
    margin-top:18px;
    font-size:clamp(18px,2.5vw,25px);font-weight:600;color:var(--ink-2);
    animation:revealBlur .9s .9s ease both;
  }
  .desc{
    margin:14px auto 0;
    font-size:16px;line-height:1.75;color:var(--ink-3);max-width:580px;
    animation:revealUp .9s 1.2s ease both;
  }

  /* 主按钮 */
  .cta{
    display:inline-flex;align-items:center;gap:10px;
    margin-top:42px;
    font-family:inherit;font-size:17px;font-weight:700;letter-spacing:.02em;
    color:#fff;cursor:pointer;
    padding:17px 40px;border-radius:16px;border:none;
    background:linear-gradient(135deg,var(--accent) 0%,var(--accent-deep) 100%);
    box-shadow:0 14px 34px -10px var(--glow),0 0 0 1px rgba(255,255,255,.25) inset;
    transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;
    animation:scaleIn .8s 1.5s cubic-bezier(.2,.8,.2,1) both,glowPulse 3.6s 2.3s ease-in-out infinite;
    position:relative;overflow:hidden;
  }
  .cta:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 24px 54px -14px var(--glow)}
  .cta:active{transform:translateY(-1px) scale(1.0)}
  .cta .arrow{display:inline-block;transition:transform .25s}
  .cta:hover .arrow{transform:translateX(5px)}
  .cta::after{
    content:"";position:absolute;top:0;left:-60%;width:42%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
    transform:skewX(-20deg);
    animation:shimmer 3s 2.6s ease-in-out infinite;
  }

  /* 统计 */
  .stats{
    margin-top:48px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;
    animation:fadeInUp .9s 1.8s ease both;
  }
  .stat{padding:0 24px;text-align:center}
  .stat .n{font-size:26px;font-weight:800;color:var(--ink);font-family:var(--mono)}
  .stat .l{font-size:12px;color:var(--ink-3);letter-spacing:.05em;margin-top:3px}
  .stat+.stat{border-left:1px solid var(--line)}

  .hint{margin-top:32px;font-size:12.5px;color:var(--ink-3);animation:fadeIn 1s 2.2s ease both}
  .hint kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 7px;font-size:11.5px;color:var(--ink-2)}

  /* ===== 复用自原站的动画 keyframes ===== */
  @keyframes fadeIn{0%{opacity:0}to{opacity:1}}
  @keyframes fadeInUp{0%{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @keyframes scaleIn{0%{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  @keyframes shimmer{0%,to{opacity:.4}50%{opacity:1}}
  @keyframes float{0%,to{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @keyframes glowPulse{0%,to{filter:drop-shadow(0 0 5px rgba(255,138,92,.0))}50%{filter:drop-shadow(0 0 18px rgba(255,138,92,.45))}}
  @keyframes revealScale{0%{opacity:0;transform:scale(.85);filter:blur(2px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
  @keyframes revealBlur{0%{opacity:0;filter:blur(8px);transform:translateY(16px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
  @keyframes revealUp{0%{opacity:0;transform:translateY(24px);filter:blur(3px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
  @keyframes cinematicEnter{0%{opacity:0;transform:translateY(40px) scale(.96);filter:blur(6px)}40%{opacity:.6;transform:translateY(14px) scale(.99);filter:blur(2px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}

  @media (max-width:640px){
    .stat{padding:0 14px}
    .stat .n{font-size:21px}
    .orb{display:none}
    body{overflow:auto}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-delay:0!important}
  }
</style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>

  <main class="wrap">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/>
          </linearGradient>
        </defs>
        <path d="M36 6 L18 36 H30 L26 58 L46 26 H34 Z" fill="url(#bolt)"/>
      </svg>
    </div>

    <span class="eyebrow"><span class="dot"></span>Multimodal Reasoning Benchmark</span>

    <h1>PowerMMBench</h1>
    <p class="sub">面向电力系统的多模态推理基准</p>
    <p class="desc">覆盖图文、图表、公式与场景视频的多模态评测集，396 道精选题目、4 大类别，系统衡量模型在电力领域的推理与理解能力。</p>

    <button class="cta" id="enterBtn" type="button">
      进入题库 <span class="arrow">→</span>
    </button>

    <div class="stats">
      <div class="stat"><div class="n">396</div><div class="l">题目</div></div>
      <div class="stat"><div class="n">4</div><div class="l">大类别</div></div>
      <div class="stat"><div class="n">29</div><div class="l">子领域</div></div>
      <div class="stat"><div class="n">309</div><div class="l">配图</div></div>
      <div class="stat"><div class="n">12</div><div class="l">视频</div></div>
    </div>

    <p class="hint">按 <kbd>Enter</kbd> 或点击按钮进入题库浏览器</p>
  </main>

<script>
(function(){
  var btn=document.getElementById('enterBtn');
  var going=false;
  function go(){
    if(going) return; going=true;
    btn.style.transition='transform .2s ease, opacity .2s ease';
    btn.style.transform='scale(.96)';
    btn.style.opacity='.85';
    window.location.href='benchmark_viewer.html';
  }
  btn.addEventListener('click',go);
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); }
  });
})();
</script>
</body>
</html>
